# Deploys the web build to GitHub Pages — the project site serves at /CalcVibes/.
# Trigger: every push to main, plus manual dispatch. Order: install → typecheck → test → build → deploy.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Ensure GitHub Pages site exists
        # Idempotent: creates the Pages site (build_type workflow) on first run;
        # returns 409 (already exists) afterwards, which curl reports without failing.
        run: >
          curl -s -X POST
          -H "Authorization: Bearer $GITHUB_TOKEN"
          -H "Accept: application/vnd.github+json"
          -H "X-GitHub-Api-Version: 2022-11-28"
          "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          -d '{"build_type": "workflow"}' || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install dependencies
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run typecheck
        working-directory: web
      - name: Test
        run: npm test
        working-directory: web
      - name: Build
        run: npx vite build --base=/CalcVibes/
        working-directory: web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
